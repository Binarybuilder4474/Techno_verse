<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Examination Management System</title>
</head>
<body style="font-family:system-ui,sans-serif;max-width:560px;margin:15vh auto;padding:0 1rem">
<h1>Exam system is running</h1>
<p id="s">Checking database connection...</p>
<script>
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('s').textContent = 'Server: ' + d.status + ' | Database: ' + d.database;
}).catch(() => { document.getElementById('s').textContent = 'Server unreachable'; });
</script>
</body>
</html>
